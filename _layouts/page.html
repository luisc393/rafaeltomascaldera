---
layout: default
---
<article class="wrap pagina">
  <header class="pagina-cab">
    {% if page.antetitulo %}<p class="antetitulo">{{ page.antetitulo }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.entradilla %}<p class="entradilla">{{ page.entradilla }}</p>{% endif %}
  </header>
  <div class="prosa">{{ content }}</div>
</article>
