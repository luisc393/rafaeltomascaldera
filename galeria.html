---
permalink: /galeria/
title: Galería
antetitulo: Imágenes
entradilla: Fotografías de Rafael Tomás Caldera en clases, conferencias y entrevistas.
---
<div class="galeria">
  {% for f in site.data.galeria %}
  <figure>
    <a href="{{ '/assets/img/fotos/' | append: f.foto | relative_url }}"><img src="{{ '/assets/img/fotos/' | append: f.foto | relative_url }}" alt="{{ f.pie }}" loading="lazy"{% if f.ajuste %} style="object-fit: {{ f.ajuste }}"{% endif %}></a>
    <figcaption>{{ f.pie }}</figcaption>
  </figure>
  {% endfor %}
</div>
